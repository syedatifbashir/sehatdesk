services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # DEBUG: list files, try startup, capture exit code, stay alive
    command: ["sh", "-c", "ls -la apps/web/startup.mjs; echo '---'; node apps/web/startup.mjs; echo \"EXIT CODE: $?\"; sleep infinity"]
    environment:
      DATABASE_URL: postgresql://hms:hms@postgres:5432/hms
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3100
    depends_on:
      postgres:
        condition: service_healthy
    # DEBUG: healthcheck disabled to keep container alive for log inspection

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms
      POSTGRES_DB: hms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
